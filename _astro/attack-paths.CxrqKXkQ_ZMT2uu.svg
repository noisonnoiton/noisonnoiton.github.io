<svg xmlns="http://www.w3.org/2000/svg" width="520" height="760" viewBox="0 0 520 760" role="img" aria-labelledby="title desc">
  <title id="title">서로 다른 침투 경로가 CI의 Secret 유출로 이어지는 구조</title>
  <desc id="desc">Action 태그 변조, npm 설치 스크립트, 탈취한 토큰으로 워크플로 push라는 세 경로가 악성 CI 코드 실행으로 이어진다. 실행 중 접근 가능한 Secret은 외부 전송이나 로그 다운로드로 유출된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="520" height="760" rx="16" fill="#f8fafc"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
    <text x="28" y="48" font-size="28" font-weight="700">출발점은 달라도, 표적은 Secret</text>
    <text x="28" y="82" font-size="21" fill="#475569">사례별 침투 경로와 공통 실행 지점</text>
    <g fill="#ffffff" stroke="#cbd5e1">
      <rect x="28" y="112" width="416" height="100" rx="10"/>
      <rect x="28" y="232" width="416" height="100" rx="10"/>
      <rect x="28" y="352" width="416" height="100" rx="10"/>
    </g>
    <text x="48" y="150" font-size="24" font-weight="700">Action 태그 변조</text>
    <text x="48" y="185" font-size="22" fill="#475569">tj-actions/changed-files</text>
    <text x="48" y="270" font-size="24" font-weight="700">npm 설치 스크립트 실행</text>
    <text x="48" y="305" font-size="22" fill="#475569">Shai-Hulud: 토큰 탈취 후 확산</text>
    <text x="48" y="390" font-size="24" font-weight="700">탈취한 토큰으로 워크플로 push</text>
    <text x="48" y="425" font-size="22" fill="#475569">GhostAction / Gheist</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M444 162H480V482H260V510" marker-end="url(#arrow)"/>
      <path d="M444 282H480M444 402H480"/>
      <path d="M260 592V624" marker-end="url(#arrow)"/>
    </g>
    <rect x="28" y="512" width="464" height="80" rx="10" fill="#e2e8f0"/>
    <text x="260" y="544" text-anchor="middle" font-size="25" font-weight="700">CI에서 악성 코드 실행</text>
    <text x="260" y="575" text-anchor="middle" font-size="22">실행 중 접근 가능한 Secret 수집</text>
    <rect x="28" y="626" width="464" height="80" rx="10" fill="#fee2e2"/>
    <text x="260" y="659" text-anchor="middle" font-size="25" font-weight="700" fill="#991b1b">외부 전송 또는 로그 다운로드</text>
    <text x="260" y="690" text-anchor="middle" font-size="22" fill="#991b1b">Secret 보관만으로는 막을 수 없다</text>
    <text x="28" y="738" font-size="18" fill="#475569">보고서의 공통 구조를 재구성한 개념도</text>
  </g>
</svg>
