<svg xmlns="http://www.w3.org/2000/svg" width="520" height="760" viewBox="0 0 520 760" role="img" aria-labelledby="title desc">
  <title id="title">Different entry points converge on CI secret theft</title>
  <desc id="desc">Action tag tampering, npm install scripts, and workflow pushes with stolen tokens lead to malicious code running in CI. Secrets accessible during execution leave through outbound requests or downloaded logs.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="520" height="760" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="28" y="48" font-size="28" font-weight="700">Different paths, same target</text>
    <text x="28" y="82" font-size="21" fill="#475569">Entry points converge on secrets in CI</text>
    <g fill="#ffffff" stroke="#cbd5e1">
      <rect x="28" y="112" width="416" height="100" rx="10"/>
      <rect x="28" y="232" width="416" height="100" rx="10"/>
      <rect x="28" y="352" width="416" height="100" rx="10"/>
    </g>
    <text x="48" y="150" font-size="24" font-weight="700">Tampered Action tags</text>
    <text x="48" y="185" font-size="22" fill="#475569">tj-actions/changed-files</text>
    <text x="48" y="270" font-size="24" font-weight="700">npm install script</text>
    <text x="48" y="305" font-size="22" fill="#475569">Shai-Hulud: steal tokens, then spread</text>
    <text x="48" y="390" font-size="24" font-weight="700">Stolen token pushes a workflow</text>
    <text x="48" y="425" font-size="22" fill="#475569">GhostAction / Gheist</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <path d="M444 162H480V482H260V510" marker-end="url(#arrow)"/>
      <path d="M444 282H480M444 402H480"/>
      <path d="M260 592V624" marker-end="url(#arrow)"/>
    </g>
    <rect x="28" y="512" width="464" height="80" rx="10" fill="#e2e8f0"/>
    <text x="260" y="544" text-anchor="middle" font-size="25" font-weight="700">Malicious code runs in CI</text>
    <text x="260" y="575" text-anchor="middle" font-size="22">Collects secrets available to the job</text>
    <rect x="28" y="626" width="464" height="80" rx="10" fill="#fee2e2"/>
    <text x="260" y="659" text-anchor="middle" font-size="25" font-weight="700" fill="#991b1b">Outbound request or log download</text>
    <text x="260" y="690" text-anchor="middle" font-size="22" fill="#991b1b">Secret storage alone is not protection</text>
    <text x="28" y="738" font-size="18" fill="#475569">Conceptual reconstruction of the published reports</text>
  </g>
</svg>
