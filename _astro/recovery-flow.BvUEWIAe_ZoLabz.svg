<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:349px;height:735px;background:#FFFFFF;" width="349px" height="735px" viewBox="0 0 349 735" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="172.783" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="27.141" y="55" width="291.285" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="37.141" y="81.708" fill="#0F172A" font-size="18" textLength="166.034" font-weight="700">01  대상과 상태 확인</text><text x="37.141" y="102.661" fill="#0F172A" font-size="18" textLength="246.31">구독·리소스 그룹·AKS 이름 고정</text><text x="37.141" y="123.614" fill="#0F172A" font-size="18" textLength="271.285">정상 클러스터는 재개 대상에서 제외</text><rect x="27.141" y="157.859" width="291.285" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="37.141" y="184.567" fill="#0F172A" font-size="18" textLength="196.584" font-weight="700">02  AKS 삭제 완료 확인</text><text x="37.141" y="205.521" fill="#0F172A" font-size="18" textLength="221.605">삭제 작업과 명령의 성공 확인</text><text x="37.141" y="226.474" fill="#0F172A" font-size="18" textLength="271.285">실패하면 생성 단계로 진행하지 않음</text><rect x="47.815" y="260.719" width="249.936" height="82.859" fill="#EFF6FF" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.815" y="287.427" fill="#0F172A" font-size="18" textLength="149.475" font-weight="700">03  별도 완충 시간</text><text x="57.815" y="308.38" fill="#0F172A" font-size="18" textLength="227.327">삭제 확인 뒤 조정 가능한 대기</text><text x="57.815" y="329.333" fill="#0F172A" font-size="18" textLength="229.936">내부 ID 정리 완료 신호는 아님</text><rect x="43.701" y="363.578" width="258.165" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53.701" y="390.286" fill="#0F172A" font-size="18" textLength="143.208" font-weight="700">04  클러스터 생성</text><text x="53.701" y="411.239" fill="#0F172A" font-size="18" textLength="146.346">사라진 AKS를 생성</text><text x="53.701" y="432.192" fill="#0F172A" font-size="18" textLength="238.165">강제 교체를 다시 요청하지 않음</text><rect x="16" y="466.438" width="313.567" height="103.813" fill="#FFF7ED" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="493.146" fill="#0F172A" font-size="18" textLength="149.475" font-weight="700">05  생성 결과 분류</text><text x="26" y="514.099" fill="#0F172A" font-size="18" textLength="247.174">동일한 pending-delete 충돌만</text><text x="26" y="535.052" fill="#0F172A" font-size="18" textLength="293.567">잔여 리소스 확인 후 제한적으로 재시도</text><text x="26" y="556.005" fill="#0F172A" font-size="18" textLength="210.767">다른 오류·상한 도달 시 중단</text><rect x="49.212" y="590.25" width="247.142" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.212" y="616.958" fill="#0F172A" font-size="18" textLength="172.301" font-weight="700">06  성공 후 준비 확인</text><text x="59.212" y="637.911" fill="#0F172A" font-size="18" textLength="227.142">Succeeded와 API 응답 확인</text><text x="59.212" y="658.864" fill="#0F172A" font-size="18" textLength="199.324">노드·워크로드는 후속 점검</text><ellipse cx="172.783" cy="704.109" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="172.783" cy="704.109" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="172.783" y1="35" x2="172.783" y2="55" style="stroke:#64748B;stroke-width:1;"/><polygon points="168.783,45,172.783,55,176.783,45,172.783,49" fill="#64748B" style="stroke:#64748B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.783" y1="137.859" x2="172.783" y2="157.859" style="stroke:#64748B;stroke-width:1;"/><polygon points="168.783,147.859,172.783,157.859,176.7