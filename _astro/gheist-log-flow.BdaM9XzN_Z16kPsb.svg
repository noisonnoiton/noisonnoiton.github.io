<svg xmlns="http://www.w3.org/2000/svg" width="520" height="906" viewBox="0 0 520 906" role="img" aria-labelledby="title desc">
  <title id="title">Six steps of Gheist secret theft through GitHub run logs</title>
  <desc id="desc">A stolen token pushes a workflow. An eligible job reads available secrets and prints base32-encoded values to its log. The attacker downloads the log through the API and deletes the run. Commits or cloud usage evidence may remain.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="520" height="906" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="28" y="48" font-size="28" font-weight="700">The run log becomes the leak</text>
    <text x="28" y="82" font-size="21" fill="#475569">Gheist needs no external collection server</text>
    <g fill="#ffffff" stroke="#cbd5e1">
      <rect x="28" y="112" width="464" height="88" rx="10"/>
      <rect x="28" y="226" width="464" height="88" rx="10"/>
      <rect x="28" y="340" width="464" height="88" rx="10"/>
      <rect x="28" y="568" width="464" height="88" rx="10"/>
      <rect x="28" y="682" width="464" height="88" rx="10"/>
    </g>
    <rect x="28" y="454" width="464" height="88" rx="10" fill="#fee2e2"/>
    <g font-size="24" font-weight="700">
      <text x="48" y="148">1. Push with a stolen token</text>
      <text x="48" y="262">2. Run the malicious workflow</text>
      <text x="48" y="376">3. Read accessible secrets</text>
      <text x="48" y="490" fill="#991b1b">4. Print base32 to the log</text>
      <text x="48" y="604">5. Download the log via API</text>
      <text x="48" y="718">6. Delete the workflow run</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="48" y="181">Create a branch and workflow file</text>
      <text x="48" y="295">Job must pass execution / approval gates</text>
      <text x="48" y="409">Within repository / environment access</text>
      <text x="48" y="523" fill="#991b1b">Encoded values bypass verbatim masking</text>
      <text x="48" y="637">The log carries the stolen data</text>
      <text x="48" y="751">Remove traces from the Actions view</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M260 200V224"/><path d="M260 314V338"/>
      <path d="M260 428V452"/><path d="M260 542V566"/>
      <path d="M260 656V680"/>
    </g>
    <path d="M28 802H492" stroke="#cbd5e1"/>
    <text x="28" y="838" font-size="24" font-weight="700">A missing run is not proof of safety</text>
    <text x="28" y="875" font-size="22" fill="#475569">Correlate remaining commits and cloud logs</text>
  </g>
</svg>
