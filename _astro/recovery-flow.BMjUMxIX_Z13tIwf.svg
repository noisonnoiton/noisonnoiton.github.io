<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:412px;height:735px;background:#FFFFFF;" width="412px" height="735px" viewBox="0 0 412 735" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="204.356" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="33.24" y="55" width="342.233" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="43.24" y="81.708" fill="#0F172A" font-size="18" textLength="226.011" font-weight="700">01  Identify the target</text><text x="43.24" y="102.661" fill="#0F172A" font-size="18" textLength="307.714">Fix subscription, group, and name</text><text x="43.24" y="123.614" fill="#0F172A" font-size="18" textLength="322.233">Exclude healthy clusters on resume</text><rect x="32.906" y="157.859" width="342.901" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.906" y="184.567" fill="#0F172A" font-size="18" textLength="254.408" font-weight="700">02  Confirm AKS deletion</text><text x="42.906" y="205.521" fill="#0F172A" font-size="18" textLength="322.901">Check the operation and exit status</text><text x="42.906" y="226.474" fill="#0F172A" font-size="18" textLength="261.633">Do not create if deletion fails</text><rect x="58.957" y="260.719" width="290.8" height="82.859" fill="#EFF6FF" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="68.957" y="287.427" fill="#0F172A" font-size="18" textLength="260.464" font-weight="700">03  Add a separate buffer</text><text x="68.957" y="308.38" fill="#0F172A" font-size="18" textLength="223.427">Use a configurable delay</text><text x="68.957" y="329.333" fill="#0F172A" font-size="18" textLength="270.8">Not an identity-cleanup signal</text><rect x="40.693" y="363.578" width="327.327" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50.693" y="390.286" fill="#0F172A" font-size="18" textLength="221.054" font-weight="700">04  Create the cluster</text><text x="50.693" y="411.239" fill="#0F172A" font-size="18" textLength="295.945">Create the missing AKS resource</text><text x="50.693" y="432.192" fill="#0F172A" font-size="18" textLength="307.327">Do not force another replacement</text><rect x="32.066" y="466.438" width="344.58" height="103.813" fill="#FFF7ED" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.066" y="493.146" fill="#0F172A" font-size="18" textLength="221.818" font-weight="700">05  Classify the result</text><text x="42.066" y="514.099" fill="#0F172A" font-size="18" textLength="324.58">Retry only the same pending-delete</text><text x="42.066" y="535.052" fill="#0F172A" font-size="18" textLength="309.164">conflict, after checking for residue</text><text x="42.066" y="556.005" fill="#0F172A" font-size="18" textLength="286.84">Stop on other errors or the limit</text><rect x="16" y="590.25" width="376.713" height="82.859" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="616.958" fill="#0F172A" font-size="18" textLength="203.458" font-weight="700">06  Check readiness</text><text x="26" y="637.911" fill="#0F172A" font-size="18" textLength="356.713">Check Succeeded and the API response</text><text x="26" y="658.864" fill="#0F172A" font-size="18" textLength="307.679">Review nodes and workloads next</text><ellipse cx="204.356" cy="704.109" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="204.356" cy="704.109" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="204.356" y1="35" x2="204.356" y2="55" style="stroke:#64748B;stroke-width:1;"/><polygon points="200.356,45,204.356,55,208.356,45,204.356,49" fill="#